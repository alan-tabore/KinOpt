[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinopt"
version = "1.0"
dependencies = [
  "matplotlib",
  "numpy",
  "PyQt5",
  "PyQt5-Qt5",
  "PyQt5-sip",
  "QtPy",
  "scipy",
  "tqdm",
]
requires-python = ">= 3.9"
authors = [{name = "Alan Tabore", email = "alan.tabore@gmail.com"}]
description = "KinOpt - A Kinetics Optimization Software"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
kinopt = "kinopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kinopt"]

[tool.hatch.build.targets.wheel.force-include]
"kinopt/data" = "kinopt/data"

[tool.hatch.build.targets.sdist.force-include]
"kinopt/data" = "kinopt/data"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]

[tool.pytest.ini_options]
testpaths = ["kinopt/tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["kinopt/src"]
omit = ["*/kinopt_interface.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
