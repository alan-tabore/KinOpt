[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinopt"
version = "1.1.0"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "PyQt5>=5.15.10",
  "scipy>=1.12",
  "tqdm>=4.66",
]
requires-python = ">= 3.9"
authors = [{name = "Alan Tabore", email = "alan.tabore@gmail.com"}]
description = "KinOpt - A Kinetics Optimization Software"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
kinopt = "kinopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kinopt"]

[tool.hatch.build.targets.wheel.force-include]
"kinopt/data" = "kinopt/data"

[tool.hatch.build.targets.sdist.force-include]
"kinopt/data" = "kinopt/data"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
docs = ["sphinx>=7.2", "pydata-sphinx-theme>=0.15", "myst-parser>=2"]

[tool.pytest.ini_options]
testpaths = ["kinopt/tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["kinopt/src"]
omit = ["*/kinopt_interface.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
