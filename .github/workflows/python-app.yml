name: KinOpt application

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
            dependencies: legacy
          - os: ubuntu-latest
            python: '3.10'
            dependencies: legacy
          - os: ubuntu-latest
            python: '3.14'
            dependencies: current
          - os: windows-latest
            python: '3.10'
            dependencies: legacy
          - os: windows-latest
            python: '3.14'
            dependencies: current
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints-legacy.txt
      - name: Create an isolated Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $PWD '.venv\Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install historical dependencies and package
        if: matrix.dependencies == 'legacy'
        run: python -m pip install -c ci/constraints-legacy.txt '.[test]' flake8 build
      - name: Install current dependencies and package
        if: matrix.dependencies == 'current'
        run: python -m pip install '.[test]' flake8 build
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check syntax and undefined names
        run: python -m flake8 kinopt ci --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run regression tests and record coverage
        run: python -m pytest --cov --cov-report=term --cov-report=xml:coverage.xml
      - name: Build distributable wheel
        run: python -m build --wheel
      - name: Install the built wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheels[0])], check=True)
      - name: Check installed launchers outside the repository
        working-directory: ${{ runner.temp }}
        shell: python
        env:
          GUI_SMOKE_SCRIPT: ${{ github.workspace }}/ci/smoke_installed_gui.py
        run: |
          import os
          import subprocess
          import sys
          subprocess.run(['kinopt', '--help'], check=True, timeout=30)
          subprocess.run([sys.executable, '-m', 'kinopt', '--version'], check=True, timeout=30)
          for mode in ('console', 'module', 'legacy'):
              subprocess.run([sys.executable, os.environ['GUI_SMOKE_SCRIPT'], mode], check=True, timeout=60)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt
      - name: Install package and documentation tools
        run: python -m pip install . -r docs/requirements.txt
      - name: Build documentation and treat warnings as errors
        run: python -m sphinx -W --keep-going -b html docs/source docs/build/ci-html
  build:
    name: build
    needs: [tests, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation environments to succeed
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: test "$TEST_RESULT" = success -a "$DOCS_RESULT" = success
