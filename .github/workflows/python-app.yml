name: KinOpt application

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            dependencies: legacy
          - python: '3.10'
            dependencies: legacy
          - python: '3.14'
            dependencies: current
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints-legacy.txt
      - name: Install historical dependencies and package
        if: matrix.dependencies == 'legacy'
        run: python -m pip install -c ci/constraints-legacy.txt '.[test]' flake8 build
      - name: Install current dependencies and package
        if: matrix.dependencies == 'current'
        run: python -m pip install '.[test]' flake8 build
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check syntax and undefined names
        run: python -m flake8 kinopt/src kinopt/tests --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run regression tests and record coverage
        run: python -m pytest --cov --cov-report=term --cov-report=xml:coverage.xml
      - name: Build distributable wheel
        run: python -m build --wheel
      - name: Open installed GUI outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from kinopt.src.main import QApplication, MainWindow
          app = QApplication([])
          window = MainWindow()
          window.show()
          app.processEvents()
          assert window.isVisible()
          window.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
  build:
    name: build
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation environments to succeed
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success
